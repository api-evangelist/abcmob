aid: abcmob
name: abcMob
description: >-
  abcMob is a mobile business application company founded in 2010 and headquartered in
  Westminster, California. It builds and sells ready-made and custom native business
  applications for banking, airlines, HRIS, insurance, restaurants, hotels, tourism,
  universities, gyms, music, sport clubs, brokerage, oil and gas, real estate, retail,
  agriculture, survey, TV and places of worship. Its stated approach is to write one
  codebase that is translated to native code per platform (Objective-C on iOS, Java on
  Android, C on Windows and Linux) and compiled into full native applications, with an
  HTML5 web view of the same service, so the look, feel and update cadence stay consistent
  across devices. The company sells finished client/server applications and cloud hosting
  to businesses; it publishes no public developer program, API reference, or
  machine-readable contract of any kind.
